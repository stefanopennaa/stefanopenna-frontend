# trackerID = "XX-123446-01"

[[params.handles]]
    name = "Email"
    link = "mailto:stefano@stefanopenna.it"
    icon = "envelope"
    iconStyle = "fa-solid"

[[params.handles]]
    name = "LinkedIn"
    link = "https://www.linkedin.com/in/stefano-penna/"

[[params.handles]]
    name = "GitHub"
    link = "https://github.com/stefanopennaa/"

[[params.handles]]
    name = "Gravatar"
    link = "https://www.gravatar.com/stefanopennaa"
    svg = "https://www.svgrepo.com/show/330583/gravatar.svg" # path to svg file

[outputs]
home = ["HTML", "JSON"]

[taxonomies]
tag = "tags"

[mediaTypes]
  [mediaTypes."text/vcard"]
    suffixes = ["vcf"]

[outputFormats]
  [outputFormats.VCard]
    mediaType = "text/vcard"
    baseName = "contact"
    isPlainText = true
    notAlternative = true

[markup.goldmark.renderer]
unsafe = true
