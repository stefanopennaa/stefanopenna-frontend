title = "Stefano Penna"
baseURL = "/"
theme = "hugo-resume"
languageCode = "it-IT"
locale = "it-IT"
PygmentsCodeFences = true
PygmentsCodeFencesGuessSyntax = true
PygmentsStyle = "monokai"
enableGitInfo = true

relativeURLs = true
canonifyURLs = false

defaultContentLanguage = "it"
defaultContentLanguageInSubdir = false

[params]
description = "Ciao! Sono Stefano, ho 24 anni: studio Ingegneria Informatica al Politecnico di Torino e continuo a imparare tra Arduino, cloud-native e Sviluppo Web Full Stack."
address = "Torino, TO"
email = "stefano@stefanopenna.it"
workemail = "s343693@studenti.polito.it"
favicon = "/favicon/favicon.ico"
firstName = "Stefano"
lastName = "Penna"
phone = "+393319413120"
tagline = "Studente di Ingegneria Informatica"
profileImage = "https://cdn.stefanopenna.it/images/stefano.png"
cvURL = "https://cdn.stefanopenna.it/docs/CV_Stefano.pdf"
vcardURL = "https://stefanopenna.it"
showQr = false
showContact = true
showBoards  = true
showCertifications = true
showSocializations = true
skillsIntro = "Conoscenze IT acquisite durante il mio percorso di studi:"
skillsOutro = "Inoltre, i numerosi progetti di gruppo affrontati durante il mio percorso mi hanno permesso di sviluppare competenze trasversali fondamentali: dalla comunicazione efficace alla gestione delle scadenze, dal problem solving collaborativo alla capacità di adattarmi a team con background diversi, mantenendo sempre un approccio proattivo e orientato al risultato."
# sections = ["skills","publications","creations","contributions","experience","education","blog"]
sections = ["education", "experience",  "skills", "creations", "contributions"]
vcardfields = [
    "name",
    "image",
    # "org", # I'm a student
    "email",
    "workemail",
    "phone",
    "url",
    "title"
]

# [params.google]
# 
